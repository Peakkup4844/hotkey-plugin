# =============================================
#  HotkeyCommands  –  config.yml
# =============================================

# Language file to load  →  lang/<locale>.yml  inside the plugin folder
# Bundled in the lang/ folder: en (English, default), zh (简体中文), th (ไทย), es (Español),
#   ru (Русский), vi (Tiếng Việt), id (Bahasa Indonesia), ko (한국어)
# An unknown locale falls back to English. Add your own by dropping a lang/<code>.yml in that folder.
locale: en

# Cooldown (seconds) shared across all hotkeys per player  |  0 = disabled
# Note: even with 0, a hard 50ms floor between command dispatches always applies
# (anti-flood / DoS protection). It cannot be turned off from config.
global-cooldown: 1.5

# Print trigger info to console
debug: false

# Skip Bedrock players connecting through Geyser/Floodgate.
# Their controls (F / Q / hotbar) don't map cleanly to Java keybinds and would fire
# hotkeys unexpectedly, so they are ignored by default.
# Detection works only with Floodgate (Bedrock UUIDs have most-significant-bits = 0).
# With Geyser in pure proxy mode, Bedrock players look like Java players and cannot be skipped.
ignore-bedrock: true

# ------------------------------------------------------------------
# Hotkey definitions
#
# IMPORTANT — which keys can be used:
#   Minecraft only tells the server about a FIXED set of key actions. Ordinary
#   letter keys (L, K, G, R, C, …) are handled entirely by the client and are
#   NEVER sent to the server, so they can't be turned into hotkeys without a
#   client-side mod. Using an unsupported name makes the plugin skip that entry
#   (with a warning in console) and the key will simply do nothing.
#
# Available key identifiers (the complete list):
#   SWAP_HAND          –  F
#   SNEAK_SWAP_HAND    –  Shift + F
#   DROP               –  Q
#   SNEAK_DROP         –  Shift + Q
#   DROP_STACK         –  Ctrl + Q            (drop the whole stack)
#   SNEAK_DROP_STACK   –  Shift + Ctrl + Q
#   HOTBAR_1 … HOTBAR_9              –  Number key 1–9 (or scroll wheel)
#   SNEAK_HOTBAR_1 … SNEAK_HOTBAR_9  –  Shift + number key 1–9
#
# key / keys  (one entry can be bound to several keys):
#   key: SWAP_HAND                 – single key
#   keys: [SWAP_HAND, DROP]        – any of these keys triggers this hotkey
#
# command / commands  (one entry can run several commands, in order):
#   Write the command WITHOUT a leading slash — it's added when needed at runtime.
#   command: "spawn"               – single command
#   commands:                      – all of these run on trigger
#     - "spawn"
#     - "heal"
#   (Leave commands empty + cancel-action: true to only BLOCK the vanilla action.)
#
# permission:  (WHO may use the hotkey)
#   A permission node (e.g. hkcmd.key.warp_menu) that the player must have.
#   Write  false  (or leave it blank) to require NO permission — everyone can use it.
#   NOTE: run-as: CONSOLE always needs a real permission node; false/blank is refused there.
#
# cooldown:  (per-hotkey cooldown, in seconds)
#   This hotkey's OWN cooldown, tracked separately from every other hotkey.
#   Leave it out  → the hotkey uses the global 'global-cooldown' value above.
#   cooldown: 5   → 5-second cooldown for THIS hotkey only.
#   cooldown: 0   → no cooldown for this hotkey, even if global-cooldown is set.
#   (The hard 50ms anti-flood floor still applies and cannot be turned off.)
#
# cancel-action:
#   true  – cancel the vanilla game action (item won't swap / drop / slot won't change)
#   false – vanilla action still happens AND the command runs
#
# run-as:  (HOW the command is executed)
#   PLAYER  – exactly as if the PLAYER typed the command in chat. The command is
#             checked against the player's own permissions, so if they lack the
#             permission for that command it just won't work. Use this for normal
#             commands players are allowed to run (spawn, home, warps, …).
#   CONSOLE – runs as the server CONSOLE (full privileges). Almost every command
#             works regardless of the player's permissions — use it to let players
#             trigger commands they normally couldn't (e.g. give, gamemode, kit).
#             SECURITY: a CONSOLE hotkey MUST have a non-empty 'permission' (this is
#             the permission to USE the hotkey, not to run the command). Without one
#             any player could run console commands, so the plugin refuses to load
#             such an entry (see console on startup).
# ------------------------------------------------------------------
hotkeys:

  warp_menu:
    key: SNEAK_SWAP_HAND        # Shift + F
    command: "warps"
    permission: hkcmd.key.warp_menu
    enabled: true
    cancel-action: true
    run-as: PLAYER

  go_home:
    key: SNEAK_DROP             # Shift + Q
    command: "home"
    permission: hkcmd.key.go_home
    cooldown: 5                 # this hotkey only: 5s (overrides global-cooldown)
    enabled: true
    cancel-action: true
    run-as: PLAYER

  # Example – MULTI-KEY: same command fires on F OR Q (either key triggers it)
  # permission: false here means everyone can use it (no permission node needed).
  # spawn_multikey:
  #   keys: [SWAP_HAND, DROP]
  #   command: "spawn"
  #   permission: false
  #   enabled: false
  #   cancel-action: true
  #   run-as: PLAYER

  # Example – MULTI-COMMAND: one keypress runs several commands, top to bottom
  # buff_combo:
  #   key: SNEAK_HOTBAR_9
  #   commands:
  #     - "heal"
  #     - "feed"
  #     - "msg &aBuffs applied!"
  #   permission: hkcmd.key.buff_combo
  #   enabled: false
  #   cancel-action: false
  #   run-as: PLAYER

  # Example – run-as CONSOLE: let a player trigger a command they normally can't.
  # Here heal usually needs op/permission, but running it as console bypasses that —
  # any player WITH the hotkey permission below can heal themselves on Shift+F.
  # {player} is replaced with the triggering player's name, so the console command can
  # target them. (CONSOLE requires a permission node, or the plugin refuses to load it.)
  # console_heal:
  #   key: SNEAK_SWAP_HAND
  #   command: "heal {player}"
  #   permission: hkcmd.key.console_heal
  #   enabled: false
  #   cancel-action: true
  #   run-as: CONSOLE
